name: Backend CI/CD

on:
  pull_request:
    branches:
      - development
      - master
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional tag override for manual run (e.g. v1.0.0-rc1 or test)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}/${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=${{ github.workspace }}/.m2/repository'
  DOCKERHUB_REPOSITORY: 'huydev38/taskana-backend'

jobs:
  lint_backend:
    name: Lint and code quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven Checkstyle
        run: >-
          ./mvnw -B checkstyle:check
          -pl :taskana-rest-spring-example-boot -am
          -DskipTests

  test_backend:
    name: Unit and integration tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend verification
        run: >-
          ./mvnw -B verify
          -pl :taskana-rest-spring-example-boot -am
          -Dcheckstyle.skip

  build_scan_publish:
    name: Build, scan, and publish tagged image
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          REPOSITORY: ${{ env.DOCKERHUB_REPOSITORY }}
        run: |
          if [[ "$REPOSITORY" == "YOUR_DOCKERHUB_NAMESPACE/taskana-backend" ]]; then
            echo "Set DOCKERHUB_REPOSITORY in the workflow environment first."
            exit 1
          fi

      - name: Set image name
        shell: bash
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="manual-${{ github.sha }}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${{ env.DOCKERHUB_REPOSITORY }}:${TAG}" >> "$GITHUB_ENV"

      - name: Build executable JAR
        run: >-
          ./mvnw -B clean package
          -pl :taskana-rest-spring-example-boot -am
          -DskipTests
          -Dcheckstyle.skip
          -Dmaven.javadoc.skip=true

      - name: Upload executable JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskana-backend-${{ env.IMAGE_TAG }}
          path: rest/taskana-rest-spring-example-boot/target/taskana-rest-spring-example-boot.jar
          if-no-files-found: error

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish versioned Docker image
        run: docker push "${{ env.IMAGE_NAME }}"